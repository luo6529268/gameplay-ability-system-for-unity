<!doctype html>
<html lang="zh-CN">
  <head>
    <meta name="dat-skill-flow-build-id" content="20260806142111218-e0d3a43dddbf4ce38f99c8853e113bc9" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>NTSD DAT 技能流程编辑器</title>
    <link rel="stylesheet" href="/src/client/styles.css" />
  </head>
  <body>
    <main class="editor-shell">
      <header class="topbar">
        <div class="brand" aria-label="NTSD DAT 技能流程编辑器">
          <span class="brand-mark" aria-hidden="true">◉</span>
          <strong>NTSD DAT</strong>
          <span>技能流程编辑器</span>
        </div>
        <label class="object-picker">当前角色
          <select id="object-select" aria-label="当前角色"></select>
        </label>
        <p id="server-status" data-testid="server-status" role="status">正在连接本地服务……</p>
        <span id="dirty-readout" class="status-pill">无未保存修改</span>
        <button id="apply-session" class="button button-primary" type="button" disabled>应用会话修改</button>
        <button id="save-project" class="button button-danger" type="button" disabled>覆盖 DAT 文件</button>
        <span id="revision-readout" class="revision-readout">修订版本 -</span>
      </header>

      <nav class="mobile-tabs" aria-label="编辑器区域">
        <button type="button" data-tab-target="left-panel" aria-pressed="false">技能</button>
        <button type="button" data-tab-target="preview-panel" aria-pressed="true">预览</button>
        <button type="button" data-tab-target="inspector-panel" aria-pressed="false">属性</button>
        <button type="button" data-tab-target="timeline-panel" aria-pressed="false">时间轴</button>
      </nav>

      <section class="editor-grid" aria-label="DAT 编辑工作区">
        <aside id="left-panel" class="panel left-panel" data-mobile-panel>
          <section class="panel-section skills-section">
            <div class="section-heading">
              <h2>技能列表</h2>
              <span id="skill-count" class="count-badge">0</span>
            </div>
            <div class="toolbar-row">
              <button id="new-skill" class="button button-cyan" type="button" disabled>＋ 新建技能</button>
              <button id="edit-skill" class="button button-quiet" type="button" disabled>编辑技能信息</button>
            </div>
            <div class="table-wrap skill-table-wrap">
              <table class="data-table">
                <thead><tr><th>名称</th><th>起始帧</th><th>帧数</th><th>命中跳跃</th></tr></thead>
                <tbody id="skill-list"></tbody>
              </table>
            </div>
            <p id="skill-empty" class="empty-state">尚未创建技能。点击“新建技能”定义名称和起始帧。</p>
          </section>

          <section class="panel-section flow-section">
            <div class="section-heading">
              <h2 id="flow-title">当前技能帧流程</h2>
              <span id="flow-count" class="count-badge">0</span>
            </div>
            <div class="table-wrap flow-table-wrap">
              <table class="data-table flow-table">
                <thead><tr><th>帧号</th><th>标签</th><th>下一帧</th><th>命中/受击</th></tr></thead>
                <tbody id="flow-list"></tbody>
              </table>
            </div>
          </section>
        </aside>

        <section id="preview-panel" class="panel preview-panel is-mobile-active" data-mobile-panel aria-busy="false">
          <div class="preview-toolbar">
            <div class="toolbar-group">
              <span class="toolbar-label">缩放</span>
              <button id="zoom-out" class="icon-button" type="button" aria-label="缩小">−</button>
              <output id="zoom-readout">100%</output>
              <button id="zoom-in" class="icon-button" type="button" aria-label="放大">＋</button>
              <button id="fit-preview" class="button button-quiet" type="button">适应窗口</button>
            </div>
            <div class="toolbar-group overlay-toolbar" aria-label="几何叠加层">
              <span class="toolbar-label">叠加</span>
              <button type="button" data-overlay="itr" aria-pressed="true">ITR</button>
              <button type="button" data-overlay="bdy" aria-pressed="true">BDY</button>
              <button type="button" data-overlay="opoint" aria-pressed="true">O</button>
              <button type="button" data-overlay="wpoint" aria-pressed="true">W</button>
              <button type="button" data-overlay="bpoint" aria-pressed="true">B</button>
              <button type="button" data-overlay="cpoint" aria-pressed="true">C</button>
            </div>
            <span id="coordinate-readout" class="coordinate-readout">坐标 (0, 0)</span>
          </div>
          <div class="preview-stage">
            <canvas id="sprite-canvas" data-testid="sprite-canvas" width="794" height="550" aria-label="DAT 精灵预览"></canvas>
            <div class="preview-hud">
              <span id="play-state" class="play-state">已暂停</span>
              <span>当前帧 <strong id="frame-readout">-</strong></span>
              <span>/ <span id="preview-frame-count">0</span></span>
              <span>朝向 <strong id="facing-readout">右</strong></span>
            </div>
          </div>
          <p id="diagnostics" class="diagnostics" role="status">正在等待项目数据。</p>
        </section>

        <aside id="inspector-panel" class="panel inspector-panel" data-mobile-panel>
          <div class="section-heading inspector-heading">
            <div><h2>帧属性检查</h2><p id="inspector-context">尚未选择帧</p></div>
            <select id="block-select" aria-label="检查器数据块"><option value="frame">帧基础</option></select>
          </div>
          <form id="frame-editor" aria-busy="false">
            <div id="frame-fields" class="inspector-fields"></div>
            <div class="inspector-actions">
              <button id="discard-draft" class="button button-quiet" type="button">撤销本次修改</button>
              <button id="apply-draft" class="button button-cyan" type="submit" disabled>应用本次修改</button>
            </div>
          </form>
        </aside>

        <section id="timeline-panel" class="panel timeline-panel" data-mobile-panel>
          <div class="transport-controls">
            <button id="reset-timeline" class="transport-button" type="button" title="回到起点">|◀</button>
            <button id="step-back" class="transport-button" type="button" title="后退一帧">◀</button>
            <button id="play-toggle" class="transport-button transport-play" type="button" aria-pressed="false">▶</button>
            <button id="step-once" class="transport-button" type="button" title="前进一帧">▶</button>
            <button id="jump-end" class="transport-button" type="button" title="到末帧">▶|</button>
          </div>
          <div class="timeline-content">
            <div class="timeline-meta">
              <span>DAT 帧轴</span>
              <strong id="tick-readout">0</strong>
              <span id="time-readout">0 毫秒</span>
              <label class="loop-control"><input id="loop-enabled" type="checkbox" /> 循环</label>
            </div>
            <input id="timeline-seek" class="timeline-seek" type="range" min="0" max="0" value="0" />
            <div id="timeline-segments" class="timeline-segments" aria-label="技能时间轴节点"></div>
            <div id="timeline-markers" class="timeline-markers" aria-hidden="true"></div>
          </div>
          <label class="frame-jump">跳转到帧
            <select id="frame-select"></select>
          </label>
        </section>
      </section>
    </main>

    <dialog id="skill-dialog">
      <form id="skill-form" method="dialog" aria-busy="false">
        <div class="dialog-heading"><h2 id="skill-dialog-title">新建技能</h2><button value="cancel" aria-label="关闭">×</button></div>
        <label>技能名称<input id="skill-name" name="name" maxlength="256" required /></label>
        <label>起始帧<input id="skill-start-frame" name="startFrame" type="number" min="0" max="599" required /></label>
        <p>名称与起始帧保存到项目侧车，不写入 DAT。</p>
        <div class="dialog-actions"><button class="button button-quiet" value="cancel">取消</button><button id="save-skill" class="button button-cyan" value="default">保存技能</button></div>
      </form>
    </dialog>
    <script type="module" src="/src/client/main.js"></script>
  </body>
</html>
