<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>NTSD DAT 技能流程编辑器</title>
    <link rel="stylesheet" href="/src/client/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header><p class="eyebrow">NTSD 本地 DAT 工作区</p><h1>NTSD DAT 技能流程编辑器</h1><p id="server-status" data-testid="server-status" role="status">正在连接本地服务……</p></header>
      <section class="project-bar" aria-label="项目选择">
        <label>对象 <select id="object-select"></select></label>
        <strong id="session-name">尚未打开项目</strong><span id="revision-readout">修订版本 -</span><span id="dirty-readout">无未保存修改</span>
        <button id="save-project" type="button">保存并覆盖 DAT</button>
      </section>
      <section class="workspace" aria-label="DAT 编辑工作区">
        <canvas id="sprite-canvas" data-testid="sprite-canvas" width="794" height="550" aria-label="DAT 精灵预览"></canvas>
        <aside class="timeline-panel" aria-label="帧控制与编辑器">
          <div class="readouts"><p><span>模拟 Tick</span><strong id="tick-readout">0</strong></p><p><span>DAT 帧</span><strong id="frame-readout">-</strong></p><p><span>时间</span><strong id="time-readout">0 毫秒</strong></p></div>
          <label>DAT 帧 <select id="frame-select"></select></label>
          <div class="button-row"><button id="play-toggle" type="button" aria-pressed="false">播放</button><button id="step-once" type="button">单步</button><button id="reset-timeline" type="button">回到起点</button></div>
          <label class="range-control" for="timeline-seek">时间轴 <input id="timeline-seek" type="range" min="0" max="0" value="0" /></label>
          <label class="toggle-control"><input id="loop-enabled" type="checkbox" /> 从当前预览起点循环</label>
          <section><h2>当前帧字段</h2><p>括号内保留 DAT 原始字段名。</p><form id="frame-editor"><div id="frame-fields"></div><button type="submit">应用本次修改</button></form></section>
          <section><h2>按键跳转字段</h2><div class="hit-buttons">
            <button id="hit-a" type="button">攻击（hit_a）</button><button id="hit-d" type="button">防御（hit_d）</button><button id="hit-j" type="button">跳跃（hit_j）</button><button id="hit-fj" type="button">防御+跳跃（hit_Fj）</button><button id="hit-fa" type="button">防御+攻击（hit_Fa）</button><button id="hit-da" type="button">下+攻击（hit_Da）</button><button id="hit-ua" type="button">上+攻击（hit_Ua）</button><button id="hit-ja" type="button">跳跃+攻击（hit_ja）</button><button id="hit-dj" type="button">下+跳跃（hit_Dj）</button><button id="hit-uj" type="button">上+跳跃（hit_Uj）</button>
          </div></section>
          <section><h2>状态与诊断</h2><p id="diagnostics">正在等待项目数据。</p></section>
        </aside>
      </section>
    </main>
    <script type="module" src="/src/client/main.js"></script>
  </body>
</html>
